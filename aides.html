<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aides-Moniteurs · GES-CB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="conteneur">

    <div class="en-tete-page">
      <span class="en-tete-icone">
        <svg class="icone" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8a4 4 0 1 0-2-3.46"/><path d="M20 21v-1a3 3 0 0 0-3-3h-3"/><circle cx="7" cy="12" r="3"/><path d="M4 21v-1a3 3 0 0 1 3-3h0"/></svg>
      </span>
      <div>
        <h1>Aides-Moniteurs</h1>
        <p>Sélectionnez un aide-moniteur, puis enregistrez la sortie ou le retour.</p>
      </div>
    </div>

    <div id="zone-alertes"></div>

    <div class="colonnes-empilees">

      <!-- COLONNE 1 : SORTIE -->
      <div class="carte">
        <h2>
          <svg class="icone h2-icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8l4 4-4 4"/><path d="M4 12h14"/><path d="M18 4v16"/></svg>
          Déclarer une SORTIE
        </h2>

        <label class="champ-label">Sélectionner l'aide-moniteur</label>
        <div class="barre-recherche">
          <span class="loupe">
            <svg class="icone" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
          <input type="text" id="recherche-moniteur" placeholder="Rechercher un aide-moniteur (nom, numéro, commission...)" />
        </div>
        <div class="tableau-enveloppe">
          <table class="tableau" id="table-sortie">
            <thead>
              <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Post-nom</th>
                <th>Sexe</th>
                <th>Téléphone</th>
                <th>Commission</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="form-groupe" style="margin-top:14px;">
          <label class="champ-label" for="motif-sortie">Motif de la sortie (raison donnée par l'aide)</label>
          <input type="text" id="motif-sortie" placeholder="Nadicha, écrivez la raison ici..." />
        </div>

        <button id="btn-sortie" class="btn" disabled>Enregistrer la sortie</button>

        <div id="recap-sortie" class="recap-zone"></div>
      </div>

      <!-- COLONNE 2 : RETOUR -->
      <div class="carte">
        <h2>
          <svg class="icone h2-icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 8l-4 4 4 4"/><path d="M20 12H6"/><path d="M6 4v16"/></svg>
          Déclarer un RETOUR
        </h2>
        <p style="color:#888; font-size:13px; margin-bottom:12px;">
          Aides-Moniteurs actuellement <strong style="color:#E74C3C;">DEHORS</strong> :
        </p>
        <div class="tableau-enveloppe">
          <table class="tableau" id="table-retour">
            <thead>
              <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Post-nom</th>
                <th>Sexe</th>
                <th>Téléphone</th>
                <th>Commission</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button id="btn-retour" class="btn btn-vert" disabled>Valider le retour</button>
        <div id="recap-retour" class="recap-zone"></div>
      </div>

    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.PAGE_MONITEURS = { actif: "aides.html", filtreRole: "Aide-Moniteur", titre: "Aides-Moniteurs" };
  </script>
  <script src="js/moniteurs.js"></script>
</body>
</html>
