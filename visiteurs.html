<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visiteurs · GES-CB</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="conteneur">

    <div class="deux-colonnes">

      <!-- COLONNE 1 : ARRIVEE -->
      <div class="carte">
        <h2>👋 Enregistrer un VISITEUR</h2>

        <div class="form-groupe">
          <label class="champ-label" for="nom-visiteur">Nom et Prénom</label>
          <input type="text" id="nom-visiteur" />
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="tel-visiteur">Téléphone (optionnel)</label>
          <input type="tel" id="tel-visiteur" />
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="motif-visiteur">Objet de la visite</label>
          <input type="text" id="motif-visiteur" />
        </div>

        <button id="btn-arrivee" class="btn">Enregistrer l'arrivée</button>
      </div>

      <!-- COLONNE 2 : DEPART -->
      <div class="carte">
        <h2>🏠 Départ d'un visiteur</h2>
        <p style="color:#888; font-size:13px; margin-bottom:12px;">
          Visiteurs actuellement <strong style="color:#E67E22;">SUR LE SITE</strong> :
        </p>
        <div id="liste-depart"></div>
      </div>

    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/visiteurs.js"></script>
</body>
</html>
