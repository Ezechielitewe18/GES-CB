<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visiteurs · GES-CB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0F1B30" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GES-CB" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="conteneur">

    <div class="en-tete-page">
      <span class="en-tete-icone">
        <svg class="icone" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21V3l8 2v16"/><path d="M17 21H7"/><path d="M12 12h.01"/></svg>
      </span>
      <div>
        <h1>Visiteurs</h1>
        <p>Enregistrez les arrivées et les départs des visiteurs du camp.</p>
      </div>
    </div>

    <div class="deux-colonnes">

      <!-- COLONNE 1 : ARRIVEE -->
      <div class="carte">
        <h2>
          <svg class="icone h2-icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 8l-4 4 4 4"/><path d="M20 12H6"/><path d="M6 4v16"/></svg>
          Enregistrer un VISITEUR
        </h2>

        <div class="form-groupe">
          <label class="champ-label" for="nom-visiteur">Nom et Prénom</label>
          <input type="text" id="nom-visiteur" />
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="tel-visiteur">Téléphone (optionnel)</label>
          <input type="tel" id="tel-visiteur" />
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="motif-visiteur">Objet de la visite (pour quoi ?)</label>
          <input type="text" id="motif-visiteur" />
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="pourqui-visiteur">Pour qui ? (personne à visiter)</label>
          <input type="text" id="pourqui-visiteur" />
        </div>

        <button id="btn-arrivee" class="btn">Enregistrer l'arrivée</button>
      </div>

      <!-- COLONNE 2 : DEPART -->
      <div class="carte">
        <h2>
          <svg class="icone h2-icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8l4 4-4 4"/><path d="M4 12h14"/><path d="M18 4v16"/></svg>
          Départ d'un visiteur
        </h2>
        <p style="color:#888; font-size:13px; margin-bottom:12px;">
          Visiteurs actuellement <strong style="color:#E67E22;">SUR LE SITE</strong> :
        </p>
        <div id="liste-depart"></div>
      </div>

    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/visiteurs.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
