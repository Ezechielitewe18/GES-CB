<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enfants · GES-CB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0F1B30" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GES-CB" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="conteneur">

    <div class="en-tete-page">
      <span class="en-tete-icone">
        <svg class="icone" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="3"/><path d="M9 9.5 12 11l3-1.5"/><path d="M12 11v5"/><path d="M9 21l1.5-5h3L15 21"/></svg>
      </span>
      <div>
        <h1>Enfants</h1>
        <p>Créez un enfant et enregistrez sa sortie, ou recherchez un enfant existant pour un retour.</p>
      </div>
    </div>

    <div id="zone-alertes"></div>

    <div class="deux-colonnes">

      <!-- COLONNE 1 : NOUVEL ENFANT -->
      <div class="carte">
        <h2>
          <svg class="icone h2-icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          Nouvel enfant (Création + Sortie / Arrivée)
        </h2>

        <div class="form-groupe">
          <label class="champ-label" for="type-enfant">Type d'enfant</label>
          <select id="type-enfant">
            <option value="INTERNE">Interne — dort au camp</option>
            <option value="EXTERNE">Externe — vient le matin, rentre le soir</option>
          </select>
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="nom-enfant">Nom et Prénom de l'enfant</label>
          <input type="text" id="nom-enfant" />
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="age-enfant">Âge de l'enfant</label>
          <input type="number" id="age-enfant" min="1" max="25" placeholder="Ex. : 12" />
        </div>

        <div id="bloc-motif-creation">
          <div class="form-groupe">
            <label class="champ-label" for="motif-enfant">Motif de la sortie (optionnel)</label>
            <select id="motif-enfant">
              <option value="">— Laisser vide —</option>
              <option value="RDV médical">RDV médical</option>
              <option value="Cours">Cours</option>
              <option value="Formation">Formation</option>
              <option value="Autre">Autre...</option>
            </select>
          </div>

          <div class="form-groupe" id="bloc-autre-enfant" style="display:none;">
            <label class="champ-label" for="motif-autre-enfant">Préciser le motif</label>
            <input type="text" id="motif-autre-enfant" />
          </div>
        </div>

        <div class="form-groupe">
          <label class="champ-label" for="accompagnant-enfant">Parent / Accompagnateur (optionnel)</label>
          <input type="text" id="accompagnant-enfant" />
        </div>

        <button id="btn-nouvel-enfant" class="btn">Valider et sortir l'enfant</button>
      </div>

      <!-- COLONNE 2 : ENFANT EXISTANT -->
      <div class="carte">
        <h2>
          <svg class="icone h2-icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          Enfant existant
        </h2>

        <div class="barre-recherche">
          <span class="loupe">
            <svg class="icone" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
          <input type="search" id="recherche-enfant" placeholder="Taper le nom ou prénom..." autocomplete="off" />
        </div>
        <div class="suggestion" id="suggestions"></div>

        <div id="fiche-enfant" style="display:none;">
          <div class="form-groupe" style="margin-top:12px;">
            <div id="statut-enfant"></div>
          </div>
          <div id="form-nouvelle-sortie" style="display:none;">
            <div class="form-groupe">
              <label class="champ-label" for="motif-existant">Motif de la sortie (optionnel)</label>
              <select id="motif-existant">
                <option value="">— Laisser vide —</option>
                <option value="RDV médical">RDV médical</option>
                <option value="Cours">Cours</option>
                <option value="Formation">Formation</option>
                <option value="Autre">Autre...</option>
              </select>
            </div>
            <div class="form-groupe" id="bloc-autre-existant" style="display:none;">
              <label class="champ-label" for="motif-autre-existant">Préciser le motif</label>
              <input type="text" id="motif-autre-existant" />
            </div>
            <button id="btn-nouvelle-sortie" class="btn">Marquer une nouvelle sortie</button>
          </div>
          <div id="zone-retour" style="display:none;">
            <button id="btn-retour-enfant" class="btn btn-vert">Marquer le retour</button>
          </div>

          <!-- Zones pour les enfants EXTERNES -->
          <div id="zone-arrivee-externe" style="display:none;">
            <p style="color:#888; font-size:13px; margin-bottom:10px;">
              L'enfant est rentré chez lui. Il reviendra demain matin.
            </p>
            <button id="btn-arrivee-externe" class="btn btn-vert">Enregistrer l'arrivée du matin</button>
          </div>
          <div id="zone-depart-externe" style="display:none;">
            <p style="color:#888; font-size:13px; margin-bottom:10px;">
              L'enfant est au camp. Il rentre chez lui ce soir.
            </p>
            <button id="btn-depart-externe" class="btn">Marquer le départ du soir</button>
          </div>
        </div>

        <div id="liste-enfants" style="margin-top:16px;"></div>
      </div>

    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/enfants.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
