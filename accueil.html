<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil · GES-CB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0F1B30" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GES-CB" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-sigle">GES<span>-CB</span></div>
    <div class="splash-ligne"></div>
    <div class="splash-sous">Camp Biblique</div>
    <div class="splash-bienvenue">Bienvenue</div>
  </div>

  <div class="conteneur">

    <div class="en-tete-page">
      <span class="en-tete-icone">
        <svg class="icone" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-6h4v6"/></svg>
      </span>
      <div>
        <h1>Accueil</h1>
        <p>Camp Biblique · Menu principal</p>
      </div>
    </div>

    <div id="psaume-du-jour"></div>

    <div id="rappel-sauvegarde" class="rappel-sauvegarde" style="display:none;">
      <div class="rappel-icone">
        <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m6 11 6 6 6-6"/><path d="M4 21h16"/></svg>
      </div>
      <div class="rappel-texte">
        <strong>Pensez à sauvegarder.</strong>
        <span>Aucune sauvegarde effectuée aujourd'hui. Enregistrez le fichier .db avant de fermer.</span>
      </div>
      <a class="btn btn-gris btn-petit" href="sauvegarde.html">Sauvegarder</a>
    </div>

    <div id="grille-menu" class="grille-menu"></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/icons.js"></script>
  <script>
    (function () {
      if (!AUTH.exigerSession()) return;
      UI.installerNavbar("accueil.html");

      const grille = document.getElementById("grille-menu");

      // Rappel de sauvegarde : si des données existent et aucune sauvegarde aujourd'hui
      const pad2 = (n) => String(n).padStart(2, "0");
      const dMaintenant = new Date();
      const isoAujourd = dMaintenant.getFullYear() + "-" + pad2(dMaintenant.getMonth() + 1) + "-" + pad2(dMaintenant.getDate());
      const derSauv = localStorage.getItem("ges_cb_derniere_sauvegarde");
      const derDate = derSauv ? new Date(Number(derSauv)) : null;
      const derISO = derDate
        ? derDate.getFullYear() + "-" + pad2(derDate.getMonth() + 1) + "-" + pad2(derDate.getDate())
        : null;
      if (DB.mouvements().length > 0 && derISO !== isoAujourd) {
        document.getElementById("rappel-sauvegarde").style.display = "flex";
      }

      // Psaume du jour : visible pour Tantine Nadicha
      const psaume = DB.psaumeDuJour();
      document.getElementById("psaume-du-jour").innerHTML =
        '<div class="psaume">' +
        '<div class="psaume-titre">' +
        '<svg class="icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' +
        " Psaume du jour</div>" +
        '<div class="psaume-texte">« ' + psaume.texte + ' »</div>' +
        '<div class="psaume-ref">— ' + psaume.reference + " —</div>" +
        "</div>";

      const cartes = [
        { href: "moniteurs.html", icone: "users", titre: "Moniteurs", desc: "Sorties et retours des moniteurs" },
        { href: "aides.html", icone: "helpers", titre: "Aides-Moniteurs", desc: "Sorties et retours des aides" },
        { href: "enfants.html", icone: "child", titre: "Enfants", desc: "Mouvements des enfants" },
        { href: "visiteurs.html", icone: "door", titre: "Visiteurs", desc: "Arrivées et départs" },
        { href: "statistiques.html", icone: "chart", titre: "Statistiques", desc: "Présences en temps réel" },
        { href: "sauvegarde.html", icone: "download", titre: "Sauvegarde", desc: "Protéger et restaurer les données" },
        { href: "guide.html", icone: "book", titre: "Guide", desc: "Démonstration pour apprendre à utiliser l'app" },
      ];

      grille.innerHTML = cartes
        .map(function (c, i) {
          return (
            '<a class="carte-menu animer" style="animation-delay:' + (0.15 + i * 0.08) + 's" href="' + c.href + '">' +
            '<div class="icone">' + ICONES(c.icone, 34) + "</div>" +
            "<h3>" + c.titre + "</h3>" +
            "<p>" + c.desc + "</p>" +
            "</a>"
          );
        })
        .join("");

      // Splash de bienvenue : une seule fois par session (ou au clic)
      const splash = document.getElementById("splash");
      function fermerSplash() {
        if (!splash) return;
        splash.classList.add("sortie");
        setTimeout(function () {
          splash.remove();
          document.body.classList.add("revele");
        }, 600);
      }
      if (sessionStorage.getItem("splash_vu")) {
        splash.remove();
        document.body.classList.add("revele");
      } else {
        sessionStorage.setItem("splash_vu", "1");
        splash.addEventListener("click", fermerSplash);
        setTimeout(fermerSplash, 1800);
      }
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
