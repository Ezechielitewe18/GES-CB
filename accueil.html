<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil · GES-CB</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="conteneur">
    <div class="logo" style="margin-top:10px;">
      <div class="sigle">GES<span>-CB</span></div>
      <div class="sous-titre">Camp Biblique · Menu principal</div>
    </div>

    <div id="psaume-du-jour"></div>

    <div id="grille-menu" class="grille-menu"></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      if (!AUTH.exigerSession()) return;
      UI.installerNavbar("accueil.html");

      const role = DB.roleActuel();
      const grille = document.getElementById("grille-menu");

      // Psaume du jour : visible pour l'agent de porte (Tantine Nadicha)
      if (role === "ADMIN") {
        const psaume = DB.psaumeDuJour();
        document.getElementById("psaume-du-jour").innerHTML =
          '<div class="psaume">' +
          '<div class="psaume-titre">📖 Psaume du jour</div>' +
          '<div class="psaume-texte">« ' + psaume.texte + ' »</div>' +
          '<div class="psaume-ref">— ' + psaume.reference + " —</div>" +
          "</div>";
      }

      const cartes = [];
      if (role === "ADMIN") {
        cartes.push(
          { href: "moniteurs.html", icone: "🎓", titre: "Moniteurs & Aides", desc: "Sorties et retours des moniteurs" },
          { href: "enfants.html", icone: "🧒", titre: "Enfants", desc: "Mouvements des enfants" },
          { href: "visiteurs.html", icone: "🤝", titre: "Visiteurs", desc: "Arrivées et départs" }
        );
      }
      if (role === "SUPER_ADMIN") {
        cartes.push(
          { href: "statistiques.html", icone: "📊", titre: "Statistiques", desc: "Présences en temps réel" }
        );
      }

      if (cartes.length === 0) {
        grille.innerHTML = '<p style="color:#888; text-align:center;">Aucun accès disponible.</p>';
        return;
      }

      grille.innerHTML = cartes
        .map(function (c) {
          return (
            '<a class="carte-menu" href="' + c.href + '">' +
            '<div class="icone">' + c.icone + "</div>" +
            "<h3>" + c.titre + "</h3>" +
            "<p>" + c.desc + "</p>" +
            "</a>"
          );
        })
        .join("");
    })();
  </script>
</body>
</html>
